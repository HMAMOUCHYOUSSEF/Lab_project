services:
  db:
    image: postgres:16
    container_name: lab_pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: labdb
      TZ: UTC
    ports:
      - "5432:5432"
    shm_size: 1gb
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c effective_cache_size=3GB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql

  minio:                      # OPTIONAL: free local S3 replacement
    image: minio/minio
    container_name: lab_minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: